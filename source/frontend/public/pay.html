<!doctype html>
<!-- Trang "ngân hàng" giả lập mà mã QR trỏ tới. Không cần đăng nhập, không thu thập thông tin thanh toán. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/fonts.css" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/guide.css" />
  <title>Confirm payment - Hanoi Local</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/styles/upgrade.css" />
</head>
<body class="guide-page">
<main id="main" class="container pay-page">
  <section class="pay-card" aria-labelledby="pay-title">
    <p class="eyebrow">Demo payment</p>
    <h1 id="pay-title">Hanoi Local Premium</h1>
    <p id="pay-loading" role="status">Loading order…</p>
    <dl id="pay-facts" class="qr-facts" hidden>
      <div><dt>Amount</dt><dd id="pay-amount"></dd></div>
      <div><dt>Transfer note</dt><dd id="pay-memo"></dd></div>
    </dl>
    <p class="upgrade-demo">This is a demo bank page. No real money is charged and no card is needed.</p>
    <p id="pay-message" class="pay-message" role="status" hidden></p>
    <p id="pay-error" class="upgrade-error" role="alert" hidden></p>
    <button id="pay-confirm" class="button button--primary" type="button" hidden>Confirm payment</button>
  </section>
</main>
<script type="module" src="/scripts/pages/pay.page.js"></script>
</body>
</html>
